# Oracle Database Free para desarrollo local (Linux/Mac/Windows).
# Uso: docker compose up -d  (la primera vez tarda unos minutos)
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: farmacia-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: admin123
      APP_USER: farmacia
      APP_USER_PASSWORD: farmacia123
      TZ: America/Bogota   # SYSDATE (fecha de las facturas) en hora de Colombia
    volumes:
      - ./database:/database:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  oracle-data:
