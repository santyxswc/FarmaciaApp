name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -p:ContinuousIntegrationBuild=true
      - run: dotnet test --no-build -c Release --report-xunit-trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  dependencias:
    name: Paquetes vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Buscar vulnerabilidades en paquetes NuGet
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerables.txt
          if grep -q "has the following vulnerable packages" vulnerables.txt; then
            echo "::error::Hay paquetes NuGet con vulnerabilidades conocidas"
            exit 1
          fi

  stack-docker:
    name: Stack completo (Oracle + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar Oracle, cargar el esquema y arrancar la API
        run: docker compose up -d --build
      - name: Esperar a que la API esté lista
        run: |
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8080/health/ready > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::La API no quedó lista a tiempo"
          exit 1
      - name: Iniciar sesión y consultar productos
        run: |
          token=$(curl -fs -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"login":"admin","clave":"prueba"}' | jq -r .token)
          test "$token" != "null" -a -n "$token"
          curl -fs http://localhost:8080/api/productos -H "Authorization: Bearer $token" | jq 'length'
      - name: Registros si algo falla
        if: failure()
        run: docker compose logs --tail 100
